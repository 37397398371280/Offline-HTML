<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Offline HTML Runner</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #121212;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  /* Launcher UI */
  #launcher {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 10px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
    color: #ffffff;
    font-weight: 600;
  }
  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #252525;
    border: 1px solid #3a3a3a;
    color: #4dabf7;
    white-space: nowrap;
  }
  .card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: #aaaaaa;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 12px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  input[type="text"], input[type="url"] {
    flex: 1;
    min-width: 0;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 8px;
    color: #ffffff;
    padding: 12px 14px;
    font-size: 16px;
    outline: none;
  }
  input[type="text"]:focus, input[type="url"]:focus {
    border-color: #4dabf7;
  }
  button, .file-btn {
    background: #2b8a3e;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 46px;
    user-select: none;
  }
  button:active, .file-btn:active {
    opacity: 0.8;
  }
  button.primary {
    background: #1971c2;
  }
  button.danger {
    background: #c92a2a;
    padding: 10px 14px;
    font-size: 14px;
    min-height: 40px;
  }
  button.run-btn {
    background: #2b8a3e;
    padding: 10px 16px;
    font-size: 14px;
    min-height: 40px;
  }
  .file-btn {
    width: 100%;
    background: #364fc7;
    position: relative;
    overflow: hidden;
  }
  .file-btn input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  #status {
    font-size: 14px;
    color: #ffa94d;
    margin-top: 8px;
    min-height: 20px;
    word-break: break-word;
  }

  /* Saved List & Search */
  .search-wrap {
    margin-bottom: 12px;
  }
  .search-wrap input {
    width: 100%;
  }
  #saved-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .saved-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #252525;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .saved-info {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .saved-name {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .saved-meta {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }
  .saved-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .empty-msg {
    color: #777;
    font-size: 14px;
    text-align: center;
    padding: 20px 0;
  }

  /* Fullscreen Runner View */
  #runner-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 9999;
  }
  #runner-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

  <!-- Launcher Interface (Home Page) -->
  <div id="launcher">
    <div class="header-row">
      <h1>HTML Offline Runner</h1>
      <span class="badge" id="offline-badge">Checking...</span>
    </div>

    <div class="card">
      <div class="card-title">Load New HTML</div>
      <div class="input-row">
        <input type="url" id="url-input" placeholder="https://example.com/page.html" autocomplete="off">
        <button type="button" class="primary" id="load-url-btn">Load URL</button>
      </div>

      <label class="file-btn">
        <span>Upload HTML File</span>
        <input type="file" id="file-input" accept=".html,.htm,text/html,*/*">
      </label>

      <div id="status"></div>
    </div>

    <div class="card">
      <div class="card-title">Saved HTML Files</div>
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search saved files..." autocomplete="off">
      </div>
      <ul id="saved-list"></ul>
    </div>
  </div>

  <!-- Fullscreen Output Container -->
  <div id="runner-container">
    <iframe id="runner-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock"></iframe>
  </div>

<script>
(function() {
  var DB_NAME = "OfflineHtmlRunnerRawDB_v4";
  var DB_VERSION = 1;
  var STORE_NAME = "files";

  var db = null;
  var currentBlobUrl = null;
  var launcherEl = document.getElementById("launcher");
  var runnerContainer = document.getElementById("runner-container");
  var runnerFrame = document.getElementById("runner-frame");
  var urlInput = document.getElementById("url-input");
  var loadUrlBtn = document.getElementById("load-url-btn");
  var fileInput = document.getElementById("file-input");
  var searchInput = document.getElementById("search-input");
  var savedListEl = document.getElementById("saved-list");
  var statusEl = document.getElementById("status");
  var offlineBadge = document.getElementById("offline-badge");

  function setStatus(msg) {
    statusEl.textContent = msg || "";
  }

  function formatBytes(bytes) {
    if (!bytes && bytes !== 0) return "0 B";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1048576).toFixed(1) + " MB";
  }

  // Register inline Service Worker for complete offline caching
  function setupOfflineCache() {
    if ("serviceWorker" in navigator && (window.location.protocol === "https:" || window.location.hostname === "localhost")) {
      var swCode = [
        "var CACHE_NAME = 'html-runner-shell-v3';",
        "self.addEventListener('install', function(e) {",
        "  self.skipWaiting();",
        "  e.waitUntil(caches.open(CACHE_NAME).then(function(cache) {",
        "    return cache.addAll([self.location.href.split('#')[0]]);",
        "  }).catch(function(){}));",
        "});",
        "self.addEventListener('activate', function(e) {",
        "  e.waitUntil(self.clients.claim());",
        "});",
        "self.addEventListener('fetch', function(e) {",
        "  if (e.request.mode === 'navigate') {",
        "    e.respondWith(fetch(e.request).then(function(res) {",
        "      var copy = res.clone();",
        "      caches.open(CACHE_NAME).then(function(c) { c.put(e.request, copy); });",
        "      return res;",
        "    }).catch(function() {",
        "      return caches.match(e.request);",
        "    }));",
        "  }",
        "});"
      ].join("\n");

      try {
        var swBlob = new Blob([swCode], { type: "application/javascript" });
        var swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).then(function() {
          offlineBadge.textContent = navigator.onLine ? "Offline Ready" : "Offline Mode";
        }).catch(function() {
          offlineBadge.textContent = navigator.onLine ? "Online" : "Offline";
        });
      } catch (e) {
        offlineBadge.textContent = navigator.onLine ? "Online" : "Offline";
      }
    } else {
      offlineBadge.textContent = window.location.protocol === "file:" ? "Local Disk" : (navigator.onLine ? "Online" : "Offline");
    }

    window.addEventListener("online", function() { offlineBadge.textContent = "Offline Ready"; });
    window.addEventListener("offline", function() { offlineBadge.textContent = "Offline Mode"; });
  }

  // Initialize IndexedDB
  function initDb(callback) {
    if (db) {
      callback(db);
      return;
    }
    var request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onerror = function() {
      setStatus("Storage error: Could not open local database.");
    };
    request.onupgradeneeded = function(e) {
      var database = e.target.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };
    request.onsuccess = function(e) {
      db = e.target.result;
      callback(db);
    };
  }

  function getAllFiles(callback) {
    initDb(function(database) {
      var tx = database.transaction(STORE_NAME, "readonly");
      var store = tx.objectStore(STORE_NAME);
      var req = store.getAll();
      req.onsuccess = function() {
        var files = req.result || [];
        files.sort(function(a, b) {
          return b.timestamp - a.timestamp;
        });
        callback(files);
      };
      req.onerror = function() {
        callback([]);
      };
    });
  }

  function saveFileToDb(entry, callback) {
    initDb(function(database) {
      var tx = database.transaction(STORE_NAME, "readwrite");
      var store = tx.objectStore(STORE_NAME);
      var req = store.put(entry);
      req.onsuccess = function() {
        if (callback) callback(true);
      };
      req.onerror = function() {
        setStatus("Failed to save file to device storage.");
        if (callback) callback(false);
      };
    });
  }

  function deleteFileFromDb(id, callback) {
    initDb(function(database) {
      var tx = database.transaction(STORE_NAME, "readwrite");
      var store = tx.objectStore(STORE_NAME);
      var req = store.delete(id);
      req.onsuccess = function() {
        if (callback) callback(true);
      };
      req.onerror = function() {
        if (callback) callback(false);
      };
    });
  }

  // Mount raw bytes via Blob URL (no charset=utf-8 header)
  function runRawHtml(rawBuffer) {
    if (currentBlobUrl) {
      try {
        URL.revokeObjectURL(currentBlobUrl);
      } catch (e) {}
      currentBlobUrl = null;
    }

    var htmlBlob = new Blob([rawBuffer], { type: "text/html" });
    currentBlobUrl = URL.createObjectURL(htmlBlob);

    launcherEl.style.display = "none";
    document.body.style.overflow = "hidden";
    runnerContainer.style.display = "block";
    runnerFrame.src = currentBlobUrl;
  }

  function saveAndRun(name, rawBuffer, sourceType) {
    if (!rawBuffer || rawBuffer.byteLength === 0) {
      setStatus("Error: Empty file.");
      return;
    }

    var cleanName = (name || "Untitled.html").trim();
    var id = "file_" + Date.now() + "_" + Math.floor(Math.random() * 1000);

    var entry = {
      id: id,
      name: cleanName,
      source: sourceType,
      size: rawBuffer.byteLength,
      updated: new Date().toLocaleDateString(),
      timestamp: Date.now(),
      buffer: rawBuffer
    };

    saveFileToDb(entry, function(success) {
      if (success) {
        setStatus("");
        runRawHtml(rawBuffer);
      }
    });
  }

  function deleteFile(id) {
    deleteFileFromDb(id, function() {
      renderList();
    });
  }

  function renderList() {
    var query = (searchInput.value || "").toLowerCase().trim();

    getAllFiles(function(files) {
      savedListEl.innerHTML = "";

      var filtered = [];
      for (var i = 0; i < files.length; i++) {
        if (!query || files[i].name.toLowerCase().indexOf(query) !== -1) {
          filtered.push(files[i]);
        }
      }

      if (filtered.length === 0) {
        var empty = document.createElement("li");
        empty.className = "empty-msg";
        empty.textContent = files.length === 0 ? "No saved HTML files yet." : "No matching files found.";
        savedListEl.appendChild(empty);
        return;
      }

      for (var j = 0; j < filtered.length; j++) {
        (function(item) {
          var li = document.createElement("li");
          li.className = "saved-item";

          var info = document.createElement("div");
          info.className = "saved-info";
          info.onclick = function() {
            runRawHtml(item.buffer);
          };

          var title = document.createElement("div");
          title.className = "saved-name";
          title.textContent = item.name;

          var byteSize = item.size || (item.buffer ? item.buffer.byteLength : 0);
          var meta = document.createElement("div");
          meta.className = "saved-meta";
          meta.textContent = item.source + " - " + formatBytes(byteSize) + " - " + item.updated;

          info.appendChild(title);
          info.appendChild(meta);

          var actions = document.createElement("div");
          actions.className = "saved-actions";

          var runBtn = document.createElement("button");
          runBtn.type = "button";
          runBtn.className = "run-btn";
          runBtn.textContent = "Run";
          runBtn.onclick = function() {
            runRawHtml(item.buffer);
          };

          var delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "danger";
          delBtn.textContent = "Delete";
          delBtn.onclick = function() {
            deleteFile(item.id);
          };

          actions.appendChild(runBtn);
          actions.appendChild(delBtn);

          li.appendChild(info);
          li.appendChild(actions);
          savedListEl.appendChild(li);
        })(filtered[j]);
      }
    });
  }

  // Fetch URL as raw ArrayBuffer
  loadUrlBtn.onclick = function() {
    var url = (urlInput.value || "").trim();
    if (!url) {
      setStatus("Enter a valid URL first.");
      return;
    }
    if (url.indexOf("http://") !== 0 && url.indexOf("https://") !== 0) {
      url = "https://" + url;
    }

    setStatus("Downloading raw HTML bytes...");
    loadUrlBtn.disabled = true;

    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.responseType = "arraybuffer";
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        loadUrlBtn.disabled = false;
        if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
          setStatus("");
          var parts = url.split("?")[0].split("/");
          var fileName = parts[parts.length - 1] || url.replace(/^https?:\/\//, "");
          saveAndRun(fileName, xhr.response, "URL");
        } else {
          setStatus("Failed to load URL (Status: " + xhr.status + "). Server may block CORS.");
        }
      }
    };
    xhr.onerror = function() {
      loadUrlBtn.disabled = false;
      setStatus("Network or CORS error fetching URL.");
    };
    xhr.send();
  };

  // Read uploaded file as raw ArrayBuffer
  fileInput.onchange = function(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;

    setStatus("Reading raw file bytes...");
    var reader = new FileReader();
    reader.onload = function(evt) {
      setStatus("");
      saveAndRun(file.name, evt.target.result, "File");
      fileInput.value = "";
    };
    reader.onerror = function() {
      setStatus("Failed to read uploaded file.");
    };
    reader.readAsArrayBuffer(file);
  };

  searchInput.oninput = renderList;
  searchInput.onkeyup = renderList;

  function init() {
    setupOfflineCache();
    initDb(function() {
      renderList(); // Always boots straight to the home screen
    });
  }

  init();
})();
</script>
</body>
</html>
